<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>NLP Service</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    :root{
      --bg:#0b0c10; --card:#13151a; --fg:#e6e6e6; --muted:#a6a6a6;
      --accent:#6aa2ff; --ok:#32d296; --warn:#ffcc00; --err:#ff6b6b;
      --border:#21232b;
    }
    html,body{background:var(--bg);color:var(--fg);margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    .wrap{max-width:1100px;margin:28px auto;padding:0 16px}
    h1{font-size:22px;margin:0 0 10px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media (max-width:900px){.row{grid-template-columns:1fr}}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}
    .card h2{font-size:16px;margin:0 0 10px}
    label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
    input[type="text"], input[type="number"], textarea, select{
      width:100%;background:#0f1117;color:var(--fg);border:1px solid var(--border);
      border-radius:10px;padding:10px 12px;font-size:14px;outline:none;
    }
    textarea{min-height:76px;resize:vertical}
    .controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .btn{
      appearance:none;border:1px solid var(--border);background:#0f1117;color:var(--fg);
      padding:10px 14px;border-radius:10px;font-weight:600;cursor:pointer;
    }
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#081018}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .hint{font-size:12px;color:var(--muted)}
    .status{margin-top:10px;font-size:13px}
    .status.ok{color:var(--ok)} .status.warn{color:var(--warn)} .status.err{color:var(--err)}
    details{border:1px dashed var(--border);border-radius:10px;padding:8px 10px;background:#0f1117;margin-top:10px}
    summary{cursor:pointer;color:var(--muted)}
    .pill{display:inline-block;padding:4px 8px;border:1px solid var(--border);border-radius:999px;font-size:12px;color:var(--muted);margin-right:6px}
    .inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .checkbox{display:flex;gap:6px;align-items:center}
    .file-name{font-size:13px;color:var(--muted);margin-left:8px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>NLP Service</h1>

    <div class="row">
      <!-- FILE UPLOAD -->
      <div class="card">
        <h2>Upload (JSON / CSV / HTML)</h2>
        <div class="inline">
          <button class="btn" id="btn-file">Choose File</button>
          <span class="file-name" id="file-name">No file selected</span>
          <input type="file" id="file-input" style="display:none" accept=".json,.csv,.htm,.html,text/csv,application/json,text/html"/>
        </div>

        <label for="preset-file">Preset</label>
        <select id="preset-file"></select>

        <label for="labels-file">Labels (comma-separated, for zero-shot)</label>
        <input id="labels-file" type="text" placeholder="e.g., politics, economy, health"/>

        <div class="inline" style="margin-top:6px">
          <label class="checkbox"><input type="checkbox" id="stopwords-file"/> Include stopwords (label guessing)</label>
        </div>

        <div class="controls">
          <button class="btn primary" id="run-file">Run</button>
        </div>
        <div id="status-file" class="status"></div>
      </div>

      <!-- URL FETCH -->
      <div class="card">
        <h2>Process URL</h2>
        <label for="url">URL</label>
        <input id="url" type="text" placeholder="https://…"/>

        <label for="preset-url">Preset</label>
        <select id="preset-url"></select>

        <label for="labels-url">Labels (comma-separated, for zero-shot)</label>
        <input id="labels-url" type="text" placeholder="e.g., politics, economy, health"/>

        <div class="inline" style="margin-top:6px">
          <label class="checkbox"><input type="checkbox" id="stopwords-url"/> Include stopwords (label guessing)</label>
        </div>

        <details>
          <summary>Advanced rendering</summary>
          <div class="inline" style="margin-top:8px">
            <label class="checkbox"><input type="checkbox" id="render"/> Render JS</label>
            <span class="pill">Renderer</span>
            <select id="renderer">
              <option value="auto">auto</option>
              <option value="playwright">playwright</option>
              <option value="selenium">selenium</option>
            </select>
            <span class="pill">Wait selector</span>
            <input id="wait_selector" type="text" placeholder="article, main, .entry-content" style="flex:1;min-width:220px"/>
          </div>
          <div class="inline" style="margin-top:8px">
            <span class="pill">Scroll passes</span>
            <input id="scroll_passes" type="number" min="0" value="8" style="width:90px"/>
            <span class="pill">Timeout (ms)</span>
            <input id="render_timeout_ms" type="number" min="1000" value="25000" style="width:120px"/>
          </div>
          <label for="cookies">Cookies header (name=value; …)</label>
          <textarea id="cookies" placeholder="session=abc; csrftoken=xyz"></textarea>
          <label for="headers">Extra headers (JSON object)</label>
          <textarea id="headers" placeholder='{"User-Agent":"Mozilla/5.0 ...","Accept-Language":"en-US,en;q=0.9"}'></textarea>
        </details>

        <div class="controls">
          <button class="btn primary" id="run-url">Run</button>
        </div>
        <div id="status-url" class="status"></div>
      </div>
    </div>
  </div>

  <script>
    // --- Presets (mirror nlp.py PRESETS keys) ---
    const PRESETS = [
      // HF
      "sentiment-twitter","sentiment-sst2",
      "zeroshot-bart","zeroshot-mdeberta",
      "ner-conll","ner-bertbase",
      // spaCy / Stanza
      "spacy-ner","spacy-posdep","spacy-sents",
      "stanza-posdep","stanza-sents",
      // Embeddings / Topics
      "sbert-embed","bertopic","topics-nmf","topics-kmeans"
    ];

    function populatePresets(sel){
      PRESETS.forEach(p=>{
        const o=document.createElement('option'); o.value=p; o.textContent=p; sel.appendChild(o);
      });
    }

    function setStatus(el, msg, cls=''){ el.className='status '+cls; el.textContent=msg; }
    function filenameFromDisposition(h){
      if(!h) return null;
      const m = /filename\*=UTF-8''([^;]+)|filename="?([^"]+)"?/i.exec(h);
      return decodeURIComponent(m?.[1] || m?.[2] || '');
    }
    function downloadBlob(blob, name){
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download=name||'output';
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    }
    function parseLabels(s){ return (s||'').split(',').map(x=>x.trim()).filter(Boolean); }

    // --- Wire up File tab ---
    const selFile = document.getElementById('preset-file');
    const selUrl  = document.getElementById('preset-url');
    populatePresets(selFile); populatePresets(selUrl);

    const fileBtn = document.getElementById('btn-file');
    const fileIn  = document.getElementById('file-input');
    const fileName= document.getElementById('file-name');
    const statusFile = document.getElementById('status-file');

    fileBtn.onclick = ()=> fileIn.click();
    fileIn.onchange = ()=> fileName.textContent = fileIn.files?.[0]?.name || 'No file selected';

    document.getElementById('run-file').onclick = async ()=>{
      const f = fileIn.files?.[0];
      if(!f){ setStatus(statusFile, 'Choose a file first.', 'warn'); return; }
      setStatus(statusFile, 'Uploading…');

      const labels = parseLabels(document.getElementById('labels-file').value);
      const includeStop = document.getElementById('stopwords-file').checked;
      const preset = selFile.value;

      const qs = new URLSearchParams();
      if(preset) qs.set('preset', preset);
      if(labels.length) qs.set('labels', labels.join(','));
      if(includeStop) qs.set('include_stopwords','true');

      const fd = new FormData();
      fd.append('file', f, f.name);

      try{
        const res = await fetch('/predict/file?'+qs.toString(), { method:'POST', body: fd });
        if(!res.ok){
          const err = await res.text().catch(()=>res.statusText);
          throw new Error(err);
        }
        const blob = await res.blob();
        const disp = res.headers.get('Content-Disposition');
        const name = filenameFromDisposition(disp) || ('output-'+Date.now());
        downloadBlob(blob, name);
        setStatus(statusFile, 'Done — downloaded '+name, 'ok');
      }catch(e){
        setStatus(statusFile, 'Error: '+(e?.message||e), 'err');
      }
    };

    // --- Wire up URL tab ---
    const statusUrl = document.getElementById('status-url');
    document.getElementById('run-url').onclick = async ()=>{
      const url = document.getElementById('url').value.trim();
      if(!url){ setStatus(statusUrl, 'Enter a URL.', 'warn'); return; }
      setStatus(statusUrl, 'Fetching…');

      // Advanced
      const render = document.getElementById('render').checked;
      const renderer = document.getElementById('renderer').value;
      const wait_selector = document.getElementById('wait_selector').value.trim() || null;
      const scroll_passes = parseInt(document.getElementById('scroll_passes').value||'8',10);
      const render_timeout_ms = parseInt(document.getElementById('render_timeout_ms').value||'25000',10);
      const cookies = document.getElementById('cookies').value.trim() || null;

      let extra_headers = null;
      const headersTxt = document.getElementById('headers').value.trim();
      if(headersTxt){
        try{ extra_headers = JSON.parse(headersTxt); }
        catch{ setStatus(statusUrl, 'Extra headers must be valid JSON.', 'err'); return; }
      }

      const labels = parseLabels(document.getElementById('labels-url').value);
      const includeStop = document.getElementById('stopwords-url').checked;
      const preset = selUrl.value;

      const body = {
        url, render, renderer,
        wait_selector, scroll_passes, render_timeout_ms,
        cookies, extra_headers,
        preset, labels: labels.length ? labels : null,
        include_stopwords: includeStop
      };

      try{
        const res = await fetch('/predict/url', {
          method:'POST',
          headers:{'content-type':'application/json'},
          body: JSON.stringify(body)
        });
        if(!res.ok){
          const err = await res.text().catch(()=>res.statusText);
          throw new Error(err);
        }
        const blob = await res.blob();
        const disp = res.headers.get('Content-Disposition');
        const name = filenameFromDisposition(disp) || ('url-output-'+Date.now()+'.html');
        downloadBlob(blob, name);
        setStatus(statusUrl, 'Done — downloaded '+name, 'ok');
      }catch(e){
        setStatus(statusUrl, 'Error: '+(e?.message||e), 'err');
      }
    };
  </script>
</body>
</html>
