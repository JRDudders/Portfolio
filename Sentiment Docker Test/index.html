<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>NLP Service</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    :root{
      --bg:#0b0c10; --card:#13151a; --fg:#e6e6e6; --muted:#a6a6a6;
      --accent:#6aa2ff; --ok:#32d296; --warn:#ffcc00; --err:#ff6b6b;
      --border:#21232b;
    }
    html,body{background:var(--bg);color:var(--fg);margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    .wrap{max-width:1100px;margin:28px auto;padding:0 16px}
    h1{font-size:22px;margin:0 0 10px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media (max-width:900px){.row{grid-template-columns:1fr}}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}
    .card h2{font-size:16px;margin:0 0 10px}
    label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
    input[type="text"], input[type="number"], textarea, select{
      width:100%;background:#0f1117;color:var(--fg);border:1px solid var(--border);
      border-radius:10px;padding:10px 12px;font-size:14px;outline:none;
    }
    textarea{min-height:76px;resize:vertical}
    .controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .btn{
      appearance:none;border:1px solid var(--border);background:#0f1117;color:var(--fg);
      padding:10px 14px;border-radius:10px;font-weight:600;cursor:pointer;
    }
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#081018}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .hint{font-size:12px;color:var(--muted)}
    .status{margin-top:10px;font-size:13px}
    .status.ok{color:var(--ok)} .status.warn{color:var(--warn)} .status.err{color:var(--err)}
    details{border:1px dashed var(--border);border-radius:10px;padding:8px 10px;background:#0f1117;margin-top:10px}
    summary{cursor:pointer;color:var(--muted)}
    .pill{display:inline-block;padding:4px 8px;border:1px solid var(--border);border-radius:999px;font-size:12px;color:var(--muted);margin-right:6px}
    .inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .checkbox{display:flex;gap:6px;align-items:center}
    .file-name{font-size:13px;color:var(--muted);margin-left:8px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>NLP & Graph Analytics Service</h1>

    <div class="row">
      <!-- FILE UPLOAD -->
      <div class="card">
        <h2>Upload (JSON / CSV / HTML)</h2>
        <div class="inline">
          <button class="btn" id="btn-file">Choose File</button>
          <span class="file-name" id="file-name">No file selected</span>
          <input type="file" id="file-input" style="display:none" accept=".json,.csv,.htm,.html,text/csv,application/json,text/html"/>
        </div>

        <label for="preset-file">Preset</label>
        <select id="preset-file"></select>

        <label for="labels-file">Labels (comma-separated, for zero-shot)</label>
        <input id="labels-file" type="text" placeholder="e.g., politics, economy, health"/>

        <div class="inline" style="margin-top:6px">
          <label class="checkbox"><input type="checkbox" id="stopwords-file"/> Include stopwords (label guessing)</label>
        </div>

        <div class="controls">
          <button class="btn primary" id="run-file">Run</button>
        </div>
        <div id="status-file" class="status"></div>
      </div>

      <!-- URL FETCH -->
      <div class="card">
        <h2>Process URL</h2>
        <label for="url">URL</label>
        <input id="url" type="text" placeholder="https://…"/>

        <label for="preset-url">Preset</label>
        <select id="preset-url"></select>

        <label for="labels-url">Labels (comma-separated, for zero-shot)</label>
        <input id="labels-url" type="text" placeholder="e.g., politics, economy, health"/>

        <div class="inline" style="margin-top:6px">
          <label class="checkbox"><input type="checkbox" id="stopwords-url"/> Include stopwords (label guessing)</label>
        </div>

        <details>
          <summary>Advanced rendering</summary>
          <div class="inline" style="margin-top:8px">
            <label class="checkbox"><input type="checkbox" id="render"/> Render JS</label>
            <span class="pill">Renderer</span>
            <select id="renderer">
              <option value="auto">auto</option>
              <option value="playwright">playwright</option>
              <option value="selenium">selenium</option>
            </select>
            <span class="pill">Wait selector</span>
            <input id="wait_selector" type="text" placeholder="article, main, .entry-content" style="flex:1;min-width:220px"/>
          </div>
          <div class="inline" style="margin-top:8px">
            <span class="pill">Scroll passes</span>
            <input id="scroll_passes" type="number" min="0" value="8" style="width:90px"/>
            <span class="pill">Timeout (ms)</span>
            <input id="render_timeout_ms" type="number" min="1000" value="25000" style="width:120px"/>
          </div>
          <label for="cookies">Cookies header (name=value; …)</label>
          <textarea id="cookies" placeholder="session=abc; csrftoken=xyz"></textarea>
          <label for="headers">Extra headers (JSON object)</label>
          <textarea id="headers" placeholder='{"User-Agent":"Mozilla/5.0 ...","Accept-Language":"en-US,en;q=0.9"}'></textarea>
        </details>

        <div class="controls">
          <button class="btn primary" id="run-url">Run</button>
        </div>
        <div id="status-url" class="status"></div>
      </div>
    </div>

    <!-- GRAPH ANALYTICS -->
    <div class="card" style="margin-top:16px">
      <h2>Graph Analytics</h2>

      <label>Edge List File (required)</label>
      <div class="inline">
        <button class="btn" id="btn-graph-edges">Choose Edges File</button>
        <span class="file-name" id="graph-edges-name">No file selected</span>
        <input type="file" id="graph-edges-input" style="display:none" accept=".json,.csv,.edge,text/csv,application/json"/>
      </div>

      <label>Node Attributes File (optional)</label>
      <div class="inline">
        <button class="btn" id="btn-graph-nodes">Choose Nodes File</button>
        <span class="file-name" id="graph-nodes-name">No file selected</span>
        <input type="file" id="graph-nodes-input" style="display:none" accept=".json,.csv,.node,text/csv,application/json"/>
      </div>

      <label for="graph-metric">Metric</label>
      <select id="graph-metric">
        <option value="load">Load & Visualize</option>
        <option value="degrees">Degrees (In/Out/Total)</option>
        <option value="pagerank">PageRank</option>
        <option value="bfs">BFS (Breadth-First Search)</option>
        <option value="triangles">Triangle Count</option>
      </select>

      <div id="graph-params">
        <!-- PageRank parameters -->
        <div id="params-pagerank" style="display:none">
          <label for="pr-alpha">Damping factor (alpha)</label>
          <input id="pr-alpha" type="number" step="0.01" min="0" max="1" value="0.85"/>
          <div class="inline">
            <div style="flex:1">
              <label for="pr-iters">Max iterations</label>
              <input id="pr-iters" type="number" min="1" value="40"/>
            </div>
            <div style="flex:1;margin-left:8px">
              <label for="pr-tol">Tolerance</label>
              <input id="pr-tol" type="number" step="0.000001" value="0.000001"/>
            </div>
          </div>
        </div>

        <!-- BFS parameters -->
        <div id="params-bfs" style="display:none">
          <label for="bfs-source">Source node ID</label>
          <input id="bfs-source" type="text" placeholder="e.g., A, node1, 123"/>
        </div>

        <!-- Triangle parameters -->
        <div id="params-triangles" style="display:none">
          <label for="tri-max">Max nodes (skip if larger)</label>
          <input id="tri-max" type="number" min="100" value="20000"/>
        </div>
      </div>

      <div class="controls">
        <button class="btn primary" id="run-graph">Run Graph Analysis</button>
      </div>
      <div id="status-graph" class="status"></div>

      <!-- Visualization area -->
      <div id="graph-viz" style="display:none;margin-top:16px">
        <h3 style="font-size:14px;margin:8px 0">Graph Visualization</h3>
        <div id="graph-stats" style="font-size:12px;color:var(--muted);margin-bottom:8px"></div>
        <canvas id="graph-canvas" style="width:100%;height:400px;border:1px solid var(--border);border-radius:10px;background:#0f1117"></canvas>
      </div>
    </div>
  </div>

  <script>
    // --- Presets (mirror nlp.py PRESETS keys) ---
    const PRESETS = [
      // HF
      "sentiment-twitter","sentiment-sst2",
      "zeroshot-bart","zeroshot-mdeberta",
      "ner-conll","ner-bertbase",
      // spaCy / Stanza
      "spacy-ner","spacy-posdep","spacy-sents",
      "stanza-posdep","stanza-sents",
      // Embeddings / Topics
      "sbert-embed","bertopic","topics-nmf","topics-kmeans"
    ];

    function populatePresets(sel){
      PRESETS.forEach(p=>{
        const o=document.createElement('option'); o.value=p; o.textContent=p; sel.appendChild(o);
      });
    }

    function setStatus(el, msg, cls=''){ el.className='status '+cls; el.textContent=msg; }
    function filenameFromDisposition(h){
      if(!h) return null;
      const m = /filename\*=UTF-8''([^;]+)|filename="?([^"]+)"?/i.exec(h);
      return decodeURIComponent(m?.[1] || m?.[2] || '');
    }
    function downloadBlob(blob, name){
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download=name||'output';
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    }
    function parseLabels(s){ return (s||'').split(',').map(x=>x.trim()).filter(Boolean); }

    // --- Wire up File tab ---
    const selFile = document.getElementById('preset-file');
    const selUrl  = document.getElementById('preset-url');
    populatePresets(selFile); populatePresets(selUrl);

    const fileBtn = document.getElementById('btn-file');
    const fileIn  = document.getElementById('file-input');
    const fileName= document.getElementById('file-name');
    const statusFile = document.getElementById('status-file');

    fileBtn.onclick = ()=> fileIn.click();
    fileIn.onchange = ()=> fileName.textContent = fileIn.files?.[0]?.name || 'No file selected';

    document.getElementById('run-file').onclick = async ()=>{
      const f = fileIn.files?.[0];
      if(!f){ setStatus(statusFile, 'Choose a file first.', 'warn'); return; }
      setStatus(statusFile, 'Uploading…');

      const labels = parseLabels(document.getElementById('labels-file').value);
      const includeStop = document.getElementById('stopwords-file').checked;
      const preset = selFile.value;

      const qs = new URLSearchParams();
      if(preset) qs.set('preset', preset);
      if(labels.length) qs.set('labels', labels.join(','));
      if(includeStop) qs.set('include_stopwords','true');

      const fd = new FormData();
      fd.append('file', f, f.name);

      try{
        const res = await fetch('/predict/file?'+qs.toString(), { method:'POST', body: fd });
        if(!res.ok){
          const err = await res.text().catch(()=>res.statusText);
          throw new Error(err);
        }
        const blob = await res.blob();
        const disp = res.headers.get('Content-Disposition');
        const name = filenameFromDisposition(disp) || ('output-'+Date.now());
        downloadBlob(blob, name);
        setStatus(statusFile, 'Done — downloaded '+name, 'ok');
      }catch(e){
        setStatus(statusFile, 'Error: '+(e?.message||e), 'err');
      }
    };

    // --- Wire up URL tab ---
    const statusUrl = document.getElementById('status-url');
    document.getElementById('run-url').onclick = async ()=>{
      const url = document.getElementById('url').value.trim();
      if(!url){ setStatus(statusUrl, 'Enter a URL.', 'warn'); return; }
      setStatus(statusUrl, 'Fetching…');

      // Advanced
      const render = document.getElementById('render').checked;
      const renderer = document.getElementById('renderer').value;
      const wait_selector = document.getElementById('wait_selector').value.trim() || null;
      const scroll_passes = parseInt(document.getElementById('scroll_passes').value||'8',10);
      const render_timeout_ms = parseInt(document.getElementById('render_timeout_ms').value||'25000',10);
      const cookies = document.getElementById('cookies').value.trim() || null;

      let extra_headers = null;
      const headersTxt = document.getElementById('headers').value.trim();
      if(headersTxt){
        try{ extra_headers = JSON.parse(headersTxt); }
        catch{ setStatus(statusUrl, 'Extra headers must be valid JSON.', 'err'); return; }
      }

      const labels = parseLabels(document.getElementById('labels-url').value);
      const includeStop = document.getElementById('stopwords-url').checked;
      const preset = selUrl.value;

      const body = {
        url, render, renderer,
        wait_selector, scroll_passes, render_timeout_ms,
        cookies, extra_headers,
        preset, labels: labels.length ? labels : null,
        include_stopwords: includeStop
      };

      try{
        const res = await fetch('/predict/url', {
          method:'POST',
          headers:{'content-type':'application/json'},
          body: JSON.stringify(body)
        });
        if(!res.ok){
          const err = await res.text().catch(()=>res.statusText);
          throw new Error(err);
        }
        const blob = await res.blob();
        const disp = res.headers.get('Content-Disposition');
        const name = filenameFromDisposition(disp) || ('url-output-'+Date.now()+'.html');
        downloadBlob(blob, name);
        setStatus(statusUrl, 'Done — downloaded '+name, 'ok');
      }catch(e){
        setStatus(statusUrl, 'Error: '+(e?.message||e), 'err');
      }
    };

    // --- Wire up Graph Analytics ---
    const graphEdgesBtn = document.getElementById('btn-graph-edges');
    const graphEdgesIn = document.getElementById('graph-edges-input');
    const graphEdgesName = document.getElementById('graph-edges-name');
    const graphNodesBtn = document.getElementById('btn-graph-nodes');
    const graphNodesIn = document.getElementById('graph-nodes-input');
    const graphNodesName = document.getElementById('graph-nodes-name');
    const statusGraph = document.getElementById('status-graph');
    const graphMetric = document.getElementById('graph-metric');

    graphEdgesBtn.onclick = ()=> graphEdgesIn.click();
    graphEdgesIn.onchange = ()=> graphEdgesName.textContent = graphEdgesIn.files?.[0]?.name || 'No file selected';
    graphNodesBtn.onclick = ()=> graphNodesIn.click();
    graphNodesIn.onchange = ()=> graphNodesName.textContent = graphNodesIn.files?.[0]?.name || 'No file selected';

    // Show/hide parameter sections based on metric selection
    graphMetric.onchange = ()=>{
      document.getElementById('params-pagerank').style.display = graphMetric.value === 'pagerank' ? 'block' : 'none';
      document.getElementById('params-bfs').style.display = graphMetric.value === 'bfs' ? 'block' : 'none';
      document.getElementById('params-triangles').style.display = graphMetric.value === 'triangles' ? 'block' : 'none';
    };

    // Store graph data for visualization
    let currentGraphData = null;

    document.getElementById('run-graph').onclick = async ()=>{
      const edgesFile = graphEdgesIn.files?.[0];
      if(!edgesFile){ setStatus(statusGraph, 'Choose an edges file first.', 'warn'); return; }

      const nodesFile = graphNodesIn.files?.[0];
      const metric = graphMetric.value;
      setStatus(statusGraph, 'Processing…');

      const fd = new FormData();
      fd.append('edges_file', edgesFile, edgesFile.name);
      if(nodesFile) fd.append('nodes_file', nodesFile, nodesFile.name);

      try{
        let endpoint = '/graph/' + metric;
        let qs = '';

        // Add metric-specific parameters
        if(metric === 'pagerank'){
          const alpha = document.getElementById('pr-alpha').value;
          const iters = document.getElementById('pr-iters').value;
          const tol = document.getElementById('pr-tol').value;
          qs = `?alpha=${alpha}&iters=${iters}&tol=${tol}`;
        } else if(metric === 'bfs'){
          const source = document.getElementById('bfs-source').value.trim();
          if(!source){ setStatus(statusGraph, 'Enter a source node for BFS.', 'warn'); return; }
          qs = `?source=${encodeURIComponent(source)}`;
        } else if(metric === 'triangles'){
          const maxNodes = document.getElementById('tri-max').value;
          qs = `?max_nodes=${maxNodes}`;
        }

        const res = await fetch(endpoint + qs, { method:'POST', body: fd });
        if(!res.ok){
          const err = await res.text().catch(()=>res.statusText);
          throw new Error(err);
        }

        // For 'load', we get JSON response to visualize
        if(metric === 'load'){
          const data = await res.json();
          currentGraphData = data;
          displayGraph(data);
          setStatus(statusGraph, `Loaded ${data.n_nodes} nodes, ${data.n_edges} edges`, 'ok');
        } else {
          // For other metrics, download the result
          const blob = await res.blob();
          const disp = res.headers.get('Content-Disposition');
          const name = filenameFromDisposition(disp) || (metric+'-output-'+Date.now()+'.json');
          downloadBlob(blob, name);
          setStatus(statusGraph, 'Done — downloaded '+name, 'ok');

          // If it's JSON, also try to visualize
          if(blob.type.includes('json')){
            const text = await blob.text();
            try{
              const data = JSON.parse(text);
              if(data.nodes && data.edges){
                currentGraphData = data;
                displayGraph(data);
              }
            }catch(e){}
          }
        }
      }catch(e){
        setStatus(statusGraph, 'Error: '+(e?.message||e), 'err');
      }
    };

    // Simple graph visualization using canvas
    function displayGraph(data){
      const viz = document.getElementById('graph-viz');
      const stats = document.getElementById('graph-stats');
      const canvas = document.getElementById('graph-canvas');
      const ctx = canvas.getContext('2d');

      // Show visualization
      viz.style.display = 'block';

      // Update stats
      let statsText = `${data.n_nodes} nodes, ${data.n_edges} edges`;
      if(data.has_node_attributes) statsText += ' (with attributes)';
      stats.textContent = statsText;

      // Set canvas size
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = 400;

      const w = canvas.width;
      const h = canvas.height;

      // Clear canvas
      ctx.fillStyle = '#0f1117';
      ctx.fillRect(0, 0, w, h);

      if(!data.nodes || !data.edges){
        ctx.fillStyle = '#a6a6a6';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('No visualization data available', w/2, h/2);
        return;
      }

      // Simple force-directed layout (very basic)
      const nodes = data.nodes.slice(0, 200); // Limit to 200 nodes for performance
      const edges = data.edges.filter(e => {
        return nodes.find(n => n.id === e.source) && nodes.find(n => n.id === e.target);
      });

      // Initialize positions randomly
      nodes.forEach((n, i) => {
        const angle = (i / nodes.length) * 2 * Math.PI;
        const radius = Math.min(w, h) * 0.35;
        n.x = w/2 + radius * Math.cos(angle);
        n.y = h/2 + radius * Math.sin(angle);
      });

      // Draw edges
      ctx.strokeStyle = '#21232b';
      ctx.lineWidth = 1;
      edges.forEach(e => {
        const src = nodes.find(n => n.id === e.source);
        const tgt = nodes.find(n => n.id === e.target);
        if(src && tgt){
          ctx.beginPath();
          ctx.moveTo(src.x, src.y);
          ctx.lineTo(tgt.x, tgt.y);
          ctx.stroke();
        }
      });

      // Draw nodes
      nodes.forEach(n => {
        ctx.fillStyle = '#6aa2ff';
        ctx.beginPath();
        ctx.arc(n.x, n.y, 4, 0, 2*Math.PI);
        ctx.fill();

        // Draw label for first 20 nodes
        if(nodes.indexOf(n) < 20){
          ctx.fillStyle = '#e6e6e6';
          ctx.font = '10px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(n.id, n.x, n.y - 8);
        }
      });

      // Add note if graph was truncated
      if(data.nodes.length > 200){
        ctx.fillStyle = '#a6a6a6';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(`Showing 200 of ${data.nodes.length} nodes`, 10, h - 10);
      }
    }
  </script>
</body>
</html>
