events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # File upload limits (ego networks can have many files)
    client_max_body_size 500M;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    upstream nlp_service {
        server nlp:8001;
    }

    upstream graph_service {
        server graph:8002;
    }

    # Note: audio_service uses dynamic resolution to allow starting without audio container
    # See /api/audio/ location block below

    server {
        listen 80;
        server_name localhost;

        # Serve static frontend files
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ============================================================
        # NLP Service Proxy
        # ============================================================
        location /api/nlp/ {
            proxy_pass http://nlp_service/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts (increased for large file processing and model downloads)
            # First-time model download can take 10-15 minutes for large models like mDeBERTa
            proxy_connect_timeout 3600s;  # 1 hour
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }

        # ============================================================
        # Graph Service Proxy
        # ============================================================
        location /api/graph/ {
            proxy_pass http://graph_service/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts (graph processing can take time)
            proxy_connect_timeout 3600s;  # 1 hour
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;

            # Large file uploads for ego networks (80+ files)
            client_max_body_size 500M;
        }

        # ============================================================
        # Audio Service Proxy (optional - uses dynamic resolution)
        # ============================================================
        location /api/audio/ {
            # Dynamic resolution allows nginx to start without audio service
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $audio_upstream http://audio:8003;
            proxy_pass $audio_upstream/;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Longer timeouts for audio processing
            proxy_connect_timeout 3600s;  # 1 hour
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;

            # Large file uploads (standardized to 500MB)
            client_max_body_size 500M;
        }

        # Error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
