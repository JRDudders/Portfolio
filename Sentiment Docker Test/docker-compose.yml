version: '3.8'

services:
  # Main app (Python 3.12)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - AUDIO_SERVICE_URL=http://audio:8081
    depends_on:
      - audio
    volumes:
      - ./temp:/app/temp
    networks:
      - cicerowatch

  # Audio deepfake detection service (Python 3.10)
  audio:
    build:
      context: .
      dockerfile: Dockerfile.audio
    ports:
      - "8081:8081"
    volumes:
      - ./temp:/app/temp
      - ./models:/app/models  # Cache models
    networks:
      - cicerowatch
    environment:
      - CUDA_VISIBLE_DEVICES=0  # GPU support if available

networks:
  cicerowatch:
    driver: bridge
