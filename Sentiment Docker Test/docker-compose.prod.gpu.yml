version: '3.8'

# PRODUCTION BUILD - GPU Version
# Code is baked into images, no live editing
# Use for stable deployments

services:
  # ============================================================
  # Frontend - Serves UI and acts as reverse proxy
  # ============================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: cicerowatch-frontend:latest
    container_name: cicerowatch-frontend
    ports:
      - "80:80"
    depends_on:
      - nlp
      - graph
      - audio
    networks:
      - cicerowatch
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================================
  # NLP Service - Sentiment, Entities, Topics, etc.
  # Python 3.12 with GPU support
  # ============================================================
  nlp:
    build:
      context: .
      dockerfile: Dockerfile.nlp.gpu
    image: cicerowatch-nlp-gpu:latest
    container_name: cicerowatch-nlp
    ports:
      - "8001:8001"
    environment:
      - SERVICE_NAME=nlp
      - SERVICE_PORT=8001
      - CUDA_VISIBLE_DEVICES=0
      - PYTHONUNBUFFERED=1
    networks:
      - cicerowatch
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 8G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================
  # Graph Analytics Service - GPU-accelerated with RAPIDS
  # Python 3.11 (RAPIDS requirement)
  # ============================================================
  graph:
    build:
      context: .
      dockerfile: Dockerfile.graph.gpu
    image: cicerowatch-graph-gpu:latest
    container_name: cicerowatch-graph
    ports:
      - "8002:8002"
    environment:
      - SERVICE_NAME=graph
      - SERVICE_PORT=8002
      - CUDA_VISIBLE_DEVICES=0
      - PYTHONUNBUFFERED=1
    networks:
      - cicerowatch
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 12G
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8002/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================
  # Audio Service - Deepfake Detection (Python 3.10 + fairseq)
  # ============================================================
  audio:
    build:
      context: .
      dockerfile: Dockerfile.audio
    image: cicerowatch-audio:latest
    container_name: cicerowatch-audio
    ports:
      - "8003:8003"
    environment:
      - SERVICE_NAME=audio
      - SERVICE_PORT=8003
      - CUDA_VISIBLE_DEVICES=0
      - PYTHONUNBUFFERED=1
    networks:
      - cicerowatch
    volumes:
      # Only mount temp and models directories
      - audio_models:/app/models
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 8G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  cicerowatch:
    driver: bridge

volumes:
  audio_models:
    driver: local
